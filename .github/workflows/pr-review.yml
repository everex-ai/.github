name: pr-review

# AI팀 PR 코드 검수 (재사용 워크플로). 대상 repo의 얇은 호출 yml(workflow-templates/pr-review.yml)이 부른다.
#   1단 스크립트: collect -> classify -> precheck   (반려면 Claude를 부르지 않는다)
#   2단 Claude  : claude-code-action (orchestrator + subagent 4개, plugins/everex-review). 로컬은 run_claude.sh
#   3단 스크립트: apply (PR comment, 라벨. gate=true면 반려/오류 시 check 실패)
# 문서: docs/pr-review-agent.md

on:
  workflow_call:
    inputs:
      gate:
        description: "true면 반려/오류 시 check를 실패시킨다. false면 comment와 라벨만 남긴다 (관찰 모드)"
        type: boolean
        default: false
      python_version:
        type: string
        default: "3.11"
      install_command:
        description: "대상 repo 의존성 설치 명령"
        type: string
        default: "pip install -r requirements.txt"
      pytest_args:
        description: "pytest에 덧붙일 인자 (예: -m 'not gpu')"
        type: string
        default: ""
      test_timeout:
        description: "pytest 제한 시간(초)"
        type: number
        default: 900
      orchestrator_model:
        type: string
        default: "claude-opus-5"
      tools_ref:
        description: "everex-ai/.github 에서 스크립트와 플러그인을 가져올 ref"
        type: string
        default: "main"
      skip_draft:
        type: boolean
        default: true
      reviewers:
        description: "review/override 라벨로 판정을 뒤집을 수 있는 GitHub 계정 (쉼표 구분). 비우면 override 불가"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "claude setup-token 으로 만든 구독 토큰. Claude 단계에만 준다"
        required: true

concurrency:
  group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # fork PR은 secret을 받을 수 없어 건너뛴다. draft는 skip_draft=true면 건너뛴다.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !(inputs.skip_draft && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write                  # PR comment, 라벨
      issues: write                         # 라벨 생성
    env:
      TZ: Asia/Seoul
    steps:
      - name: 대상 repo checkout (PR head)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0                    # merge-base 계산에 전체 이력이 필요하다
          persist-credentials: false

      - name: 검수 도구 checkout (everex-ai/.github)
        uses: actions/checkout@v6
        with:
          repository: everex-ai/.github
          ref: ${{ inputs.tools_ref }}
          path: .review-tools-checkout
          persist-credentials: false

      - name: 검수 도구를 대상 repo 밖으로 옮김
        # 대상 repo 안에 두면 pytest, vulture, 작업 트리 비교에 섞인다. 이후 스텝은 $TOOLS 로 참조한다
        run: |
          TOOLS="$RUNNER_TEMP/review-tools"
          rm -rf "$TOOLS"
          mv .review-tools-checkout "$TOOLS"
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"

      - name: override 확인
        # 새 push면 review/override 라벨을 떼고, 그 외에 지정 리뷰어의 override가 있으면 검수 대신 override를 반영한다
        id: override
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWERS: ${{ inputs.reviewers }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: >-
          python3 "$TOOLS/scripts/review/override.py" check --repo-slug "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
          --reviewers "$REVIEWERS" --event-action "$ACTION" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - uses: actions/setup-python@v6
        if: steps.override.outputs.active != 'true'
        with:
          python-version: ${{ inputs.python_version }}

      - name: 의존성 설치
        if: steps.override.outputs.active != 'true'
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          python -m pip install -q --upgrade pip
          bash -c "$INSTALL_COMMAND"
          pip install -q -r "$TOOLS/requirements-dev.txt"

      - name: 1. 변경 수집, 분류, 결정론적 검사 (1, 2, 3-1, 5)
        id: precheck
        if: steps.override.outputs.active != 'true'
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
          TEST_TIMEOUT: ${{ inputs.test_timeout }}
        run: |
          python "$TOOLS/scripts/review/collect.py"  --repo . --event "$GITHUB_EVENT_PATH"
          python "$TOOLS/scripts/review/classify.py" --repo .
          python "$TOOLS/scripts/review/precheck.py" --repo . --pytest-args "$PYTEST_ARGS" --test-timeout "$TEST_TIMEOUT"

      - name: orchestrator 프롬프트 읽기
        id: prompt
        if: steps.precheck.outputs.precheck == 'continue' && steps.precheck.outputs.tier != '0'
        run: |
          {
            echo "text<<EVEREX_REVIEW_PROMPT_EOF"
            cat "$TOOLS/plugins/everex-review/orchestrator.md"
            echo "EVEREX_REVIEW_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 2. Claude 검수 (3-2, 3-3, 4-1, 4-2, 6, 7)
        id: claude
        # 반려(precheck=reject)이거나 판단 대상이 없으면(등급 0) Claude를 부르지 않는다
        if: steps.precheck.outputs.precheck == 'continue' && steps.precheck.outputs.tier != '0'
        continue-on-error: true             # 실패해도 3단이 "오류"로 알린다. check 실패 여부는 gate가 정한다
        timeout-minutes: 20
        uses: anthropics/claude-code-action@v1
        with:
          # 인증은 jira-doc과 같은 Claude 계정 구독 토큰. 별도 API 키는 쓰지 않는다
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 주지 않으면 action이 Claude GitHub App 토큰(OIDC)을 요구한다. --allowedTools 에 mcp__github* 가 없어
          # GitHub 도구는 붙지 않고, action 자체의 사람/권한 확인에만 쓰인다
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          # 경로 한정 Write(...) 규칙이 -p 모드에서 동작하지 않아 Write 전체를 허용하고 apply --require-clean 으로 확인한다
          claude_args: |
            --plugin-dir ${{ env.TOOLS }}/plugins/everex-review
            --model ${{ inputs.orchestrator_model }}
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Agent,Write"

      - name: Claude 실행 요약
        if: always() && steps.claude.outcome != 'skipped' && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p .everex-review/out
          cp "$EXECUTION_FILE" .everex-review/out/claude-execution.json || true
          python "$TOOLS/scripts/review/claude_summary.py" .everex-review/out/claude-execution.json
          test -f .everex-review/out/verdict.json && echo "[claude] -> verdict.json" || echo "[claude] verdict.json 이 만들어지지 않음"

      - name: 3. PR 반영 (comment, 라벨, gate)
        if: always() && (steps.precheck.outcome == 'success' || steps.override.outputs.active == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ inputs.gate }}
          OVERRIDE_LOGIN: ${{ steps.override.outputs.login }}
        run: |
          if [ -n "$OVERRIDE_LOGIN" ]; then
            python3 "$TOOLS/scripts/review/apply.py" --repo . --override "$OVERRIDE_LOGIN" --repo-slug "$GITHUB_REPOSITORY"
          else
            python3 "$TOOLS/scripts/review/apply.py" --repo . --gate "$GATE" --require-clean --repo-slug "$GITHUB_REPOSITORY"
          fi

      - name: 검수 입력/출력 보관 (판정 비교용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everex-review-pr${{ github.event.pull_request.number }}
          path: .everex-review/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
