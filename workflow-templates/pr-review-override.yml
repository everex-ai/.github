name: pr-review-override

# 지정 리뷰어가 review/override 라벨로 PR 검수 판정을 뒤집을 때 처리한다. pr-review.yml 과 같이 둔다.
# 리뷰어 목록은 repo variable PR_REVIEW_REVIEWERS (쉼표 구분 GitHub 계정). 비어 있으면 아무도 override할 수 없다.

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write
  issues: write
  actions: write

jobs:
  override:
    uses: everex-ai/.github/.github/workflows/pr-review-override.yml@main
    with:
      reviewers: ${{ vars.PR_REVIEW_REVIEWERS }}
